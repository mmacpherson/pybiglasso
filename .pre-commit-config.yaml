repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=2000]
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: debug-statements
  - id: detect-aws-credentials
    args: [--allow-missing-credentials]
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: name-tests-test
    args: [--pytest-test-first]
    # Helpers the tests import, not tests themselves
    exclude: ^tests/(rcompare\.py|reference\.py|r/)
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format
    # ruff-pre-commit 0.17 formats Markdown code blocks too; keep it to code.
    types_or: [python, pyi, jupyter]
- repo: https://github.com/crate-ci/typos
  rev: v1.46.0
  hooks:
  - id: typos
    files: \.(md|txt)$
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --indent, '2']
    # Pin the formatter: an unpinned one varies with when each machine's hook
    # environment was built (toml-sort 0.24 and 0.25 space inline tables
    # differently). The weekly update-pre-commit-hooks workflow bumps this pin.
    additional_dependencies: [toml-sort==0.25.0]
    # Lockfiles are machine-written; reformatting them only makes churn.
    exclude: ^uv\.lock$
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
