# pre-commit.ci's runners have no Rust toolchain; CI's hooks step runs these
ci:
  skip: [cargo-fmt, cargo-clippy]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=2000]
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: debug-statements
  - id: detect-aws-credentials
    args: [--allow-missing-credentials]
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: name-tests-test
    args: [--pytest-test-first]
    # Helpers the tests import, not tests themselves
    exclude: ^tests/(support/|r/)
  - id: trailing-whitespace
    # Original patch context/recorded sources are checksummed evidence, not code to rewrite.
    exclude: ^benchmarks/results/int8-m1-pro-quiet/
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    # Keep the exact executed scripts covered by the evidence manifest.
    exclude: ^benchmarks/results/int8-m1-pro-quiet/
  - id: ruff-format
    # ruff-pre-commit 0.17 formats Markdown code blocks too; keep it to code.
    types_or: [python, pyi, jupyter]
    exclude: ^benchmarks/results/int8-m1-pro-quiet/
- repo: https://github.com/crate-ci/typos
  rev: v1.51.1
  hooks:
  - id: typos
    files: \.(md|txt)$
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --indent, '2']
    # Pin the formatter: an unpinned one varies with when each machine's hook
    # environment was built (toml-sort 0.24 and 0.25 space inline tables
    # differently). The weekly update-pre-commit-hooks workflow bumps this pin.
    additional_dependencies: [toml-sort==0.25.0]
    # Lockfiles are machine-written; reformatting them only makes churn.
    exclude: ^(uv\.lock|rust/Cargo\.lock)$
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt
    entry: cargo fmt --manifest-path rust/Cargo.toml --check
    language: system
    files: ^rust/
    pass_filenames: false
  - id: cargo-clippy
    name: cargo clippy
    entry: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings
    language: system
    files: ^rust/
    pass_filenames: false
