[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
ndarray = "0.17"
numpy = "0.30"
pulp = { version = "0.22.3", features = ["x86-v4"] }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
rayon = "1.12"

[lib]
crate-type = ["cdylib"]
name = "_rust"

[package]
edition = "2024"
license = "GPL-3.0-or-later"
name = "pybiglasso-rs"
publish = false
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
