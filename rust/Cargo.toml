[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
libm = { version = "0.2.16", default-features = false }
ndarray = "0.17"
numpy = { version = "0.30", optional = true }
pulp = { version = "0.22.3", features = ["x86-v4"] }
pyo3 = { version = "0.30", features = ["abi3-py311"], optional = true }
rayon = "1.12"
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
default = ["python"]
python = ["dep:numpy", "dep:pyo3"]
wasm = ["dep:serde", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[lib]
crate-type = ["cdylib"]
name = "_rust"

[package]
edition = "2024"
license = "GPL-3.0-or-later"
name = "pybiglasso-rs"
publish = false
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "fat"
