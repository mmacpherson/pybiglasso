version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ci
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  commit-message:
    prefix: deps
  groups:
    uv-lock:
      patterns: ['*']
- package-ecosystem: cargo
  directory: /rust
  schedule:
    interval: monthly
  commit-message:
    prefix: deps
  groups:
    cargo-lock:
      patterns: ['*']
