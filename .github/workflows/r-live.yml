name: Live R comparison

# Fit the comparison grid in the current CRAN release of R biglasso, to catch
# upstream changes (the stored fixtures pin one version).
on:
  pull_request:
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  r-live:
    name: R biglasso (current CRAN)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884    # v10.3.0
      with:
        python-version: '3.14'
    - name: R and biglasso versions
      run: make r-versions R_VERSION=latest
    - name: Compare against live R
      run: make test-r R_VERSION=latest
