name: Live R comparison

# Fit the comparison grid in the current CRAN release of R biglasso, to catch
# upstream changes (the stored fixtures pin one version).
on:
  pull_request:
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  r-live:
    name: R biglasso (current CRAN)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2    # v10.3.3
      with:
        python-version: '3.14'
    - name: R and biglasso versions
      run: make r-versions R_VERSION=latest
    - name: Compare against live R
      run: make test-r R_VERSION=latest
  # The weekly run has no pull request to show its failure: open an issue
  notify:
    name: Report a scheduled failure
    needs: r-live
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue create --repo "$GITHUB_REPOSITORY" \
          --title "Live R comparison failed against current CRAN" \
          --body "The weekly comparison with the current CRAN release of R biglasso failed: $RUN"
