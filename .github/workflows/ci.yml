name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the full-ci label reruns a PR with full coverage
    types: [opened, synchronize, reopened, labeled]
  workflow_call:  # from release.yml, on the tagged commit

permissions:
  contents: read

# a new push to a pull request cancels its earlier run; main and tags run
# every commit, so each of their runs gets a group of its own (a shared group
# would still drop a pending run when a third arrived)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every uv command uses uv.lock as committed, and fails if it is stale
# (except the latest- and minimum-deps jobs).
env:
  UV_LOCKED: 1

jobs:
  # Pull requests get every platform's tests but macOS, and only the Linux x86
  # wheel. The other wheels build on main, on release, and on any PR that
  # changes packaging, bindings, the toolchain, dependencies or CI. macOS,
  # whose runners can queue for an hour, runs on main and on release. The
  # full-ci label gives a PR both. (A small inline decision rather than a make
  # recipe: it is CI plumbing, with nothing to run locally.)
  scope:
    name: Choose coverage
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.choose.outputs.full }}
      macos: ${{ steps.choose.outputs.macos }}
      wheels: ${{ steps.choose.outputs.wheels }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: choose
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        full=true
        macos=true
        if [ "$EVENT" = pull_request ]; then
          full=false
          macos=false
          builds='^(pyproject\.toml|uv\.lock|Makefile|rust-toolchain(\.toml)?|rust/(Cargo\.(toml|lock)|build\.rs|src/(lib|python)\.rs)|\.github/|scripts/(check_(wheel|dist|arch_bits)|wheel_provenance)\.py)'
          # On its own line so a failed diff stops the step (bash -e) rather
          # than reading as "nothing build-related changed"
          files=$(git diff --name-only "$BASE...$HEAD")
          if jq -e 'any(.[]?; . == "full-ci")' <<<"$LABELS" >/dev/null; then
            full=true; macos=true; echo "full coverage, with macOS: full-ci label"
          elif changed=$(grep -E "$builds" <<<"$files"); then
            full=true; echo "full coverage: build-related changes:"; echo "$changed"
          fi
        fi
        wheels='[
          {"platform": "linux-x86_64", "os": "ubuntu-latest", "target": "x86_64",
           "container": "quay.io/pypa/manylinux2014_x86_64@sha256:dc58399aca4cfb0de257f92e2de71b4f8421e60cce8542fcd5e28df0c0760942"},
          {"platform": "linux-aarch64", "os": "ubuntu-24.04-arm", "target": "aarch64",
           "container": "quay.io/pypa/manylinux2014_aarch64@sha256:db68ee9e5e879da5945dfbc8cab446f02245da6522aca0a9e4cda9256c911d2f"},
          {"platform": "macos-arm64", "os": "macos-latest", "target": "aarch64"},
          {"platform": "macos-x86_64", "os": "macos-15-intel", "target": "x86_64"},
          {"platform": "windows-x86_64", "os": "windows-latest", "target": "x64"}
        ]'
        if [ "$full" = false ]; then wheels=$(jq '[.[0]]' <<<"$wheels"); fi
        if [ "$macos" = false ]; then wheels=$(jq '[.[] | select(.os | startswith("macos") | not)]' <<<"$wheels"); fi
        echo "full=$full" >> "$GITHUB_OUTPUT"
        echo "macos=$macos" >> "$GITHUB_OUTPUT"
        echo "wheels=$(jq -c . <<<"$wheels")" >> "$GITHUB_OUTPUT"

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.14'
    - run: make run-hooks-all-files

  # Native kernels and exact-rational certificate audits, once per platform
  # (macOS runs them in the macos job).
  rust-kernels:
    name: Rust kernels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.14'
    # The Rust build, from main's last run, when the Rust sources are
    # unchanged: the key hashes their contents, and only an exact hit restores.
    # A checkout dates every file now, so cargo would rebuild; dating the
    # sources before the restored build lets it reuse that build. The key
    # names the compiler too, so a runner's new rustc saves a fresh build.
    - name: Name the Rust compiler
      id: rustc
      shell: bash
      run: |
        echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p' | tr -d '\r' | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore the Rust build, if its sources are unchanged
      id: rust-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: rust-test-${{ matrix.os }}-rustc${{ steps.rustc.outputs.commit }}-${{ hashFiles('rust/**', '!rust/target/**', 'pyproject.toml', 'tests/support/gaussian_screening/**') }}
    - name: Date the Rust sources before the restored build
      if: steps.rust-cache.outputs.cache-hit == 'true'
      shell: bash
      run: git ls-files -z rust tests/support/gaussian_screening | xargs -0 touch -t 200001010000
    - name: Bit for bit at every SIMD width this CPU runs
      run: make test-rust
    - name: Save the Rust build for later runs
      if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
        - os: ubuntu-24.04-arm
          python: '3.14'
        - os: windows-latest
          python: '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: ${{ matrix.python }}
    # The Rust build, from main's last run, when the Rust sources are
    # unchanged: the key hashes their contents, and only an exact hit restores.
    # A checkout dates every file now, so cargo would rebuild; dating the
    # sources before the restored build lets it reuse that build. The key
    # names the compiler too, so a runner's new rustc saves a fresh build.
    - name: Name the Rust compiler
      id: rustc
      shell: bash
      run: |
        echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p' | tr -d '\r' | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore the Rust build, if its sources are unchanged
      id: rust-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: rust-ext-${{ matrix.os }}-py${{ matrix.python }}-rustc${{ steps.rustc.outputs.commit }}-${{ hashFiles('rust/**', '!rust/target/**', 'pyproject.toml') }}
    - name: Date the Rust sources before the restored build
      if: steps.rust-cache.outputs.cache-hit == 'true'
      shell: bash
      run: git ls-files -z rust | xargs -0 touch -t 200001010000
    - name: Tests (against stored R biglasso 1.7.2 output)
      run: make test
    - name: Save the Rust build for later runs
      if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}
    - name: Record fixed Rust fits for the cross-architecture check
      if: matrix.python == '3.14'
      shell: bash
      run: uv run python scripts/check_arch_bits.py record rust-bits-${{ matrix.os }}.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      if: matrix.python == '3.14'
      with:
        name: rust-bits-${{ matrix.os }}
        path: rust-bits-${{ matrix.os }}.json
        if-no-files-found: error
        retention-days: 7

  # macOS runners queue longest, so its native kernels, Python tests and
  # bit snapshot share one runner, and run only where scope says.
  macos:
    name: macOS (Rust kernels, Python 3.14, bit snapshot)
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.14'
    # The Rust builds, as in the jobs above: one cache holds both the kernel
    # tests' build and the extension's.
    - name: Name the Rust compiler
      id: rustc
      shell: bash
      run: |
        echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p' | tr -d '\r' | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore the Rust build, if its sources are unchanged
      id: rust-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: rust-macos-rustc${{ steps.rustc.outputs.commit }}-${{ hashFiles('rust/**', '!rust/target/**', 'pyproject.toml', 'tests/support/gaussian_screening/**') }}
    - name: Date the Rust sources before the restored build
      if: steps.rust-cache.outputs.cache-hit == 'true'
      shell: bash
      run: git ls-files -z rust tests/support/gaussian_screening | xargs -0 touch -t 200001010000
    - name: Bit for bit at every SIMD width this CPU runs
      run: make test-rust
    - name: Tests (against stored R biglasso 1.7.2 output)
      run: make test
    - name: Save the Rust build for later runs
      if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}
    - name: Record fixed Rust fits for the cross-architecture check
      shell: bash
      run: uv run python scripts/check_arch_bits.py record rust-bits-macos-latest.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: rust-bits-macos-latest
        path: rust-bits-macos-latest.json
        if-no-files-found: error
        retention-days: 7

  rust-cross-architecture:
    name: Rust fits, bit-identical across platforms
    needs: [scope, test, macos]
    # without macOS on a pull request, compare the other three platforms
    if: >-
      always() && needs.test.result == 'success'
      && (needs.macos.result == 'success'
          || (needs.scope.outputs.macos == 'false' && needs.macos.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333    # v8.0.2
      with:
        pattern: rust-bits-*
        path: snapshots
        merge-multiple: true
    - name: Compare the other runners against this run's Linux x86 reference
      shell: bash
      env:
        MACOS: ${{ needs.scope.outputs.macos }}
      run: |
        platforms=(ubuntu-latest ubuntu-24.04-arm windows-latest)
        flags=(--without-macos)
        if [ "$MACOS" = true ]; then platforms+=(macos-latest); flags=(); fi
        files=()
        for platform in "${platforms[@]}"; do files+=("snapshots/rust-bits-$platform.json"); done
        python3 scripts/check_arch_bits.py compare "${flags[@]}" "${files[@]}"

  latest-deps:
    name: Newest dependencies (ignoring uv.lock)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.15'
    - run: make test-latest

  minimum-deps:
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.11'
    - run: make test-minimum

  recipes:
    name: Data recipes (docs/data.md), PostgreSQL included
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: recipes
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:recipes@localhost:5432/postgres
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.14'
    - run: make test-recipes
    - run: make test-recipes-postgres

  sdist:
    name: Build the sdist and a wheel from it; fit from that wheel with no extras
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        enable-cache: false    # this build is what release.yml publishes
    - name: Build, check the metadata PyPI will render, and fit from the wheel
      run: make check-dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        retention-days: 7

  # one abi3 wheel per platform, for every supported Python; release.yml
  # publishes these with the sdist
  wheels:
    name: Wheel (${{ matrix.platform }})
    needs: scope
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.wheels) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b    # v1.51.0
      with:
        command: build
        target: ${{ matrix.target }}
        rust-toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        container: ${{ matrix.container }}
        manylinux: auto
        before-script-linux: make wheel-provenance
        args: --release --out dist
    - name: Record the host wheel build toolchain
      if: runner.os != 'Linux'
      run: make wheel-provenance
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        enable-cache: false
        python-version: ${{ matrix.python }}
    - name: Fit from the wheel with no extras
      shell: bash
      run: make check-wheel
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: dist-wheel-${{ matrix.platform }}
        path: dist/*.whl
        retention-days: 7

  # The one check required before merging: it fails unless every job above
  # succeeded, so a failed, cancelled or skipped job blocks the merge. The
  # only exception: macOS may be skipped where scope chose to skip it.
  ci-passed:
    name: CI passed
    if: always()
    needs: [scope, hooks, rust-kernels, test, macos, rust-cross-architecture, latest-deps, minimum-deps, recipes, sdist, wheels]
    runs-on: ubuntu-latest
    steps:
    - name: Every job succeeded
      env:
        RESULTS: ${{ toJSON(needs) }}
        FULL: ${{ needs.scope.outputs.full }}
        MACOS: ${{ needs.scope.outputs.macos }}
      run: |
        echo "full coverage: ${FULL:-unknown}; macOS: ${MACOS:-unknown}"
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
        jq -e --arg macos "$MACOS" 'to_entries | all(.[];
          .value.result == "success"
          or (.key == "macos" and $macos == "false" and .value.result == "skipped"))' <<<"$RESULTS" >/dev/null
