name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # from release.yml, on the tagged commit

permissions:
  contents: read

# a new push to a pull request cancels its earlier run; main and tags run
# every commit, so each of their runs gets a group of its own (a shared group
# would still drop a pending run when a third arrived)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every uv command uses uv.lock as committed, and fails if it is stale
# (except the latest-deps job).
env:
  UV_LOCKED: 1

jobs:
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.14'
    - run: make run-hooks-all-files

  # the kernels don't depend on Python, so once per platform, beside the tests
  rust-kernels:
    name: Rust kernels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    # The Rust build, from main's last run, when the Rust sources are
    # unchanged: the key hashes their contents, and only an exact hit restores.
    # A checkout dates every file now, so cargo would rebuild; dating the
    # sources before the restored build lets it reuse that build. The key
    # names the compiler too, so a runner's new rustc saves a fresh build.
    - name: Name the Rust compiler
      id: rustc
      shell: bash
      run: |
        echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p' | tr -d '\r' | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore the Rust build, if its sources are unchanged
      id: rust-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: rust-test-${{ matrix.os }}-rustc${{ steps.rustc.outputs.commit }}-${{ hashFiles('rust/**', '!rust/target/**', 'pyproject.toml') }}
    - name: Date the Rust sources before the restored build
      if: steps.rust-cache.outputs.cache-hit == 'true'
      shell: bash
      run: git ls-files -z rust | xargs -0 touch -t 200001010000
    - name: Bit for bit at every SIMD width this CPU runs
      run: make test-rust
    - name: Save the Rust build for later runs
      if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
        - os: ubuntu-24.04-arm
          python: '3.14'
        - os: macos-latest
          python: '3.14'
        - os: windows-latest
          python: '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: ${{ matrix.python }}
    # The Rust build, from main's last run, when the Rust sources are
    # unchanged: the key hashes their contents, and only an exact hit restores.
    # A checkout dates every file now, so cargo would rebuild; dating the
    # sources before the restored build lets it reuse that build. The key
    # names the compiler too, so a runner's new rustc saves a fresh build.
    - name: Name the Rust compiler
      id: rustc
      shell: bash
      run: |
        echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p' | tr -d '\r' | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - name: Restore the Rust build, if its sources are unchanged
      id: rust-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: rust-ext-${{ matrix.os }}-py${{ matrix.python }}-rustc${{ steps.rustc.outputs.commit }}-${{ hashFiles('rust/**', '!rust/target/**', 'pyproject.toml') }}
    - name: Date the Rust sources before the restored build
      if: steps.rust-cache.outputs.cache-hit == 'true'
      shell: bash
      run: git ls-files -z rust | xargs -0 touch -t 200001010000
    - name: Tests (against stored R biglasso 1.7.2 output)
      run: make test
    - name: Save the Rust build for later runs
      if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
      with:
        path: rust/target
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}
    - name: Tests, numba backend (deprecated; goes in 0.3.0)
      run: make test
      env:
        PYBIGLASSO_BACKEND: numba
    - name: Record fixed Rust fits for the cross-architecture check
      if: matrix.python == '3.14'
      shell: bash
      run: uv run python scripts/check_arch_bits.py record rust-bits-${{ matrix.os }}.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      if: matrix.python == '3.14'
      with:
        name: rust-bits-${{ matrix.os }}
        path: rust-bits-${{ matrix.os }}.json
        if-no-files-found: error
        retention-days: 7

  rust-cross-architecture:
    name: Rust fits, bit-identical across platforms
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333    # v8.0.2
      with:
        pattern: rust-bits-*
        path: snapshots
        merge-multiple: true
    - name: Compare ARM and Windows runners against this run's Linux x86 reference
      run: >-
        python3 scripts/check_arch_bits.py compare
        snapshots/rust-bits-ubuntu-latest.json
        snapshots/rust-bits-ubuntu-24.04-arm.json
        snapshots/rust-bits-macos-latest.json
        snapshots/rust-bits-windows-latest.json

  latest-deps:
    name: Newest dependencies (ignoring uv.lock)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        python-version: '3.15'
    - run: make test-latest

  sdist:
    name: Build the sdist and a wheel from it; fit from that wheel with no extras
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        enable-cache: false    # this build is what release.yml publishes
    - name: Build, check the metadata PyPI will render, and fit from the wheel
      run: make check-dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
        retention-days: 7

  # one abi3 wheel per platform, for every supported Python; release.yml
  # publishes these with the sdist
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x86_64
          os: ubuntu-latest
          target: x86_64
        - platform: linux-aarch64
          os: ubuntu-24.04-arm
          target: aarch64
        - platform: macos-arm64
          os: macos-latest
          target: aarch64
        - platform: macos-x86_64
          os: macos-15-intel
          target: x86_64
        - platform: windows-x86_64
          os: windows-latest
          target: x64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b    # v1.51.0
      with:
        command: build
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e    # v10.3.2
      with:
        enable-cache: false
        python-version: ${{ matrix.python }}
    - name: Fit from the wheel with no extras
      shell: bash
      run: uv run --isolated --no-project --with dist/*.whl python scripts/check_wheel.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: dist-wheel-${{ matrix.platform }}
        path: dist/*.whl
        retention-days: 7
