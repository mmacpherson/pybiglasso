name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # from release.yml, on the tagged commit

permissions:
  contents: read

# Every uv command uses uv.lock as committed, and fails if it is stale
# (except the latest-deps job).
env:
  UV_LOCKED: 1

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
        - os: macos-latest
          python: '3.13'
        - os: windows-latest
          python: '3.13'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78    # v7.6.0
      with:
        python-version: ${{ matrix.python }}
    - name: Pre-commit hooks
      if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      run: make run-hooks-all-files
    - name: Tests (against stored R biglasso 1.7.2 output)
      run: make test

  latest-deps:
    name: Newest dependencies (ignoring uv.lock)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78    # v7.6.0
      with:
        python-version: '3.15'
    - run: make test-latest

  dist:
    name: Build the package; install the wheel with no extras
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78    # v7.6.0
      with:
        enable-cache: false    # this build is what release.yml publishes
    - name: Build, check the metadata PyPI will render, and fit from the wheel
      run: make check-dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7.0.2
      with:
        name: dist-package
        path: dist/
        retention-days: 7
