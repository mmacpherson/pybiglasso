[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2"]

[dependency-groups]
bench = ["glum", "skglm", "scikit-learn", "statsmodels", "benchopt", "seaborn"]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pybiglasso[all]",
  "pre-commit>=4.6.2",
  "hypothesis>=6.170.9",
  "pytest-xdist>=3.8.0"
]

[project]
authors = [{ name = "Mike Macpherson", email = "mmacpherson@users.noreply.github.com" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "numpy",
  "scipy"
]
description = "Unofficial Python port of R's biglasso: lasso and elastic-net paths for larger-than-memory data."
keywords = [
  "lasso",
  "elastic-net",
  "glmnet",
  "biglasso",
  "out-of-core",
  "larger-than-memory",
  "memmap",
  "logistic-regression",
  "polygenic-risk-score"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
name = "pybiglasso"
readme = "README.md"
requires-python = ">=3.11"
version = "0.3.1"

[project.optional-dependencies]
all = ["pybiglasso[arrow,ingest,polars,pandas,sklearn,viz]"]
arrow = ["pyarrow"]
ingest = ["pybiglasso[arrow]", "openpyxl"]
pandas = ["pandas"]
polars = ["polars"]
sklearn = ["scikit-learn>=1.6"]
viz = ["seaborn>=0.13"]

[project.urls]
Homepage = "https://github.com/mmacpherson/pybiglasso"
"R biglasso" = "https://github.com/pbreheny/biglasso"

# The Python package in src, with the Rust extension from rust/ built into it
# as pybiglasso._rust: one wheel per platform, for every Python (abi3). The
# sdist adds what builds and tests the package.
[tool.maturin]
exclude = [{ path = "**/__pycache__/**", format = "sdist" }]
include = [
  { path = "tests/**/*", format = "sdist" },
  { path = "examples/**/*", format = "sdist" }
]
manifest-path = "rust/Cargo.toml"
module-name = "pybiglasso._rust"
python-source = "src"
strip = true

[tool.pytest.ini_options]
addopts = "-rxEfs --strict-markers --tb short -m 'not r and not soak'"
markers = [
  "r: runs R biglasso live (needs Rscript, or CONTAINER + R_IMAGE)",
  "soak: large problems against live R; slow, meant for local runs"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "W", "I", "B", "UP"]

# rebuild the Rust extension in the development environment when its source
# changes
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "rust/Cargo.toml" },
  { file = "rust/Cargo.lock" },
  { file = "rust/src/**/*.rs" }
]
