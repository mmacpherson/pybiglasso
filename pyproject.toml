[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybiglasso"
version = "0.1.0"
description = "Unofficial Python port of R's biglasso: lasso and elastic-net paths for larger-than-memory data."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mike Macpherson", email = "mmacpherson@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = [
    "lasso",
    "elastic-net",
    "glmnet",
    "biglasso",
    "out-of-core",
    "larger-than-memory",
    "memmap",
    "logistic-regression",
    "polygenic-risk-score",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numba",
    "numpy",
    "scipy",
    "threadpoolctl",
]

[project.optional-dependencies]
polars = ["polars"]
pandas = ["pandas"]
sklearn = ["scikit-learn>=1.6"]
viz = ["seaborn>=0.13"]
all = ["pybiglasso[polars,pandas,sklearn,viz]"]

[project.urls]
Homepage = "https://github.com/mmacpherson/pybiglasso"
"R biglasso" = "https://github.com/pbreheny/biglasso"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pybiglasso[all]"]
bench = ["glum", "skglm", "scikit-learn", "statsmodels", "benchopt", "seaborn"]

[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks/results", "/docs", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rxEfs --strict-markers --tb short -m 'not r and not soak'"
markers = [
    "r: runs R biglasso live (needs Rscript, or CONTAINER + R_IMAGE)",
    "soak: large problems against live R; slow, meant for local runs",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
