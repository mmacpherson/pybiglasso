[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
bench = ["glum", "skglm", "scikit-learn", "statsmodels", "benchopt", "seaborn"]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pybiglasso[all]",
  "pre-commit>=4.6.2"
]

[project]
authors = [{ name = "Mike Macpherson", email = "mmacpherson@users.noreply.github.com" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "numba",
  "numpy",
  "scipy"
]
description = "Unofficial Python port of R's biglasso: lasso and elastic-net paths for larger-than-memory data."
keywords = [
  "lasso",
  "elastic-net",
  "glmnet",
  "biglasso",
  "out-of-core",
  "larger-than-memory",
  "memmap",
  "logistic-regression",
  "polygenic-risk-score"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
name = "pybiglasso"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
all = ["pybiglasso[polars,pandas,sklearn,viz]"]
pandas = ["pandas"]
polars = ["polars"]
sklearn = ["scikit-learn>=1.6"]
viz = ["seaborn>=0.13"]

[project.urls]
Homepage = "https://github.com/mmacpherson/pybiglasso"
"R biglasso" = "https://github.com/pbreheny/biglasso"

[tool.hatch.build.targets.sdist]
exclude = ["/benchmarks/results", "/docs", "/.github"]

[tool.pytest.ini_options]
addopts = "-rxEfs --strict-markers --tb short -m 'not r and not soak'"
markers = [
  "r: runs R biglasso live (needs Rscript, or CONTAINER + R_IMAGE)",
  "soak: large problems against live R; slow, meant for local runs"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "W", "I", "B", "UP"]
